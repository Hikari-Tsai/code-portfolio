name: PR-Agent Review

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs do not receive the API key. Ignore drafts and bot-generated events.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check API key configuration
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          if [ -z "$OPENAI_KEY" ]; then
            echo "::error::Add the OPENAI_KEY repository Actions secret before running PR-Agent."
            exit 1
          fi

      # The action retrieves PR diffs through the GitHub API; no checkout is needed.
      - name: Review pull request
        uses: qodo-ai/pr-agent@29709d42e805fceab0a74580a191499b2d3c725a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          CONFIG.MODEL: ${{ vars.PR_AGENT_MODEL || 'gpt-4.1' }}
          CONFIG.FALLBACK_MODELS: '[]'
          CONFIG.RESPONSE_LANGUAGE: zh-TW
          CONFIG.USE_REPO_SETTINGS_FILE: 'false'
          CONFIG.USE_GLOBAL_SETTINGS_FILE: 'false'
          CONFIG.ENABLE_AUTO_APPROVAL: 'false'
          CONFIG.LOG_LEVEL: INFO
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: 'false'
          GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: 'true'
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/review"]'
          PR_REVIEWER.PERSISTENT_COMMENT: 'true'
          PR_REVIEWER.ENABLE_REVIEW_LABELS_SECURITY: 'false'
          PR_REVIEWER.ENABLE_REVIEW_LABELS_EFFORT: 'false'
          PR_REVIEWER.EXTRA_INSTRUCTIONS: >-
            請使用繁體中文。優先檢查實際錯誤、GitHub Pages 靜態匯出與 basePath、
            圖片資源路徑、響應式排版、可存取性，以及 WebGL 資源釋放與減少動態效果。
            不要捏造個人經歷或認證資訊。只提出有程式碼依據且可採取行動的問題。
